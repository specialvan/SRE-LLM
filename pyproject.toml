[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "starship-recovery"
version = "0.1.0"
description = "Engineering package for the Starship Super Heavy chopstick-catch recovery algorithm."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "starship-recovery contributors" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["starship*"]
exclude = ["tests*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
