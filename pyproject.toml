[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-decide"
version = "0.1.0"
description = "Decision dynamics for autonomous driving under Lyapunov hard constraints."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "auto-decide contributors" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["auto_decide*"]
exclude = ["tests*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
